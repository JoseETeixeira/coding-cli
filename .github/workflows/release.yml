name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build each platform archive in parallel and stash it as a workflow artifact.
  # No job touches the GitHub release here, so there is no concurrent
  # release-creation race (the cause of intermittent "already_exists: tag_name"
  # failures that left releases missing some platform binaries).
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            ext: tar.gz
          - goos: darwin
            goarch: arm64
            ext: tar.gz
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: windows
            goarch: amd64
            ext: zip
          - goos: windows
            goarch: arm64
            ext: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history + tags so build.sh's `git describe --tags` resolves the
          # release version for the embedded ldflags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install zip
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: 'true'
        run: bash ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coding-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/coding-cli_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  # Single job that creates the release exactly once after every archive built.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
